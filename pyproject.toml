[project]
name = "hummingbot"
# Kept dynamic so setup.py stays the single source of the version string (it appends
# ".dev1" when DEV_MODE is set). The mirrored literal lives in [tool.poetry] below.
dynamic = ["version"]
description = "Hummingbot"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Hummingbot Foundation", email = "dev@hummingbot.org" }]
# The 3.12 floor is what the dependency set actually requires: pandas-ta 0.4.71b0 needs
# >=3.12 and decibel-python-sdk 0.2.1 needs >=3.11. The old ">=3.10.12" carried over from
# setup.py/environment.yml was never satisfiable with these pins.
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.8.5,<3.14",  # aiohttp 3.14 requires a stream_writer arg that aioresponses 0.7.8 doesn't pass, breaking HTTP-mocked tests
    "aiomqtt>=2.0.0",
    "aioprocessing>=2.0.1",
    "aioresponses>=0.7.4",
    "aiounittest>=1.4.2",
    "appdirs>=1.4.4",
    "appnope>=0.1.4; sys_platform == 'darwin'",
    "aptos-sdk>=0.8.0",
    "async-timeout>=4.0.2,<5",
    "asyncssh>=2.13.2",
    "base58>=2.1.1",
    "bidict>=0.22.1",
    "bip-utils>=2.9.3",
    "Brotli>=1.2.0",  # aiohttp>=3.13.3 calls Decompressor.process(data, max_length); Brotli<1.2.0 takes only one arg
    "cachetools>=5.3.1",
    "cryptography>=41.0.2",
    "decibel-python-sdk==0.2.1",
    # NOTE: setup/pip_packages.txt used to install `eip712-structs` with --no-deps. It is
    # dropped here: nothing in the tree imports it, nothing depends on it, and it is the sole
    # source of `pysha3`, which does not build on Python 3.12 (that is why --no-deps existed).
    # The `eip712` package injective-py needs is a different project and resolves normally.
    "eth-account>=0.13.0",
    "injective-py>=1.13",
    "lighter-sdk==1.0.8",
    "msgpack>=1.0.5",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "objgraph>=3.6.0",
    "pandas>=2.3.2",
    "pandas-ta>=0.4.71b",
    "prompt_toolkit>=3.0.39",
    "protobuf>=4.23.3",
    "psutil>=5.9.5",
    "ptpython>3.0.25",
    "pydantic>=2",
    "pyjwt>=2.3.0",
    "pyperclip>=1.8.2",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    "ruamel.yaml>=0.18",
    "safe-pysha3>=1.0.4",
    "scalecodec>=1.2.0",
    "scipy>=1.11.1",
    "six>=1.16.0",
    "solders>=0.19.0",
    "sqlalchemy>=1.4.49",
    "tabulate==0.9.0",
    "TA-Lib>=0.6.4",
    "tqdm>=4.67.1",
    "typer>=0.9.0",
    "ujson>=5.7.0",
    "urllib3>=1.26.15,<2.0",  # This needs to be restricted to <2.0 - tests fail otherwise
    "web3>=6.11.0",
    "xrpl-py>=4.4.0",
]

[project.urls]
Homepage = "https://github.com/hummingbot/hummingbot"

[project.scripts]
# Replaces the `ln -sf bin/hbot $CONDA_PREFIX/bin/hbot` symlink the conda install used to do.
hbot = "hummingbot.cli.main:main"

[tool.poetry]
# Mirrors setup.py's version literal. Required because [project].version is dynamic.
version = "20260729"

[tool.poetry.group.dev.dependencies]
autopep8 = ">=2.3.2"
black = ">=24.0.0"
coverage = ">=7.2.7"
cython = ">=3.0.12"
diff-cover = ">=7.7.0"
flake8 = ">=6.0.0"
isort = ">=5.12.0"
plotly = ">=5.18.0"  # lazily imported by hummingbot/strategy_v2/backtesting/backtesting_result.py
pre-commit = ">=3.3.3"
pytest = ">=7.4.0"
pytest-asyncio = ">=0.16.0"
pytest-timeout = ">=2.1.0"
setuptools = ">=80.8.0"
wheel = "*"

# Replaces setup/environment_dydx.yml. Install with: make install DYDX=1
[tool.poetry.group.dydx]
optional = true

[tool.poetry.group.dydx.dependencies]
# PyPI names differ from the conda-forge ones environment_dydx.yml used:
#   dydxprotocol-v4-proto-py -> v4-proto  (the `v4_proto.*` imports in dydx_v4_data_source.py)
#   gql-with-aiohttp         -> gql[aiohttp]
v4-proto = "*"
gql = { version = ">=3.4.1", extras = ["aiohttp"] }

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
# Fail any single test that runs longer than this (seconds) instead of hanging the
# whole CI run. Uses the SIGALRM-based method so a timed-out test raises in the main
# thread and the suite continues, surfacing every real failure in one run.
timeout = 120
timeout_method = "signal"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[build-system]
requires = ["setuptools", "wheel", "numpy>=2.2.6", "cython>=3.0.12"]
build-backend = "setuptools.build_meta"

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
# Replaces the old `conda_env = "hummingbot"`, which classified imports by inspecting the
# conda env's site-packages. Only `hummingbot` is listed on purpose: `test` is also a CPython
# stdlib package name and must keep sorting as stdlib, as it did before.
known_first_party = ["hummingbot"]
filter_files = true
# extend_skip, NOT skip: `skip` REPLACES isort's built-in skip list, which includes ".venv".
# With the virtualenv now living inside the checkout (poetry.toml sets virtualenvs.in-project),
# a plain `skip` would let `isort .` rewrite imports inside site-packages and break installed
# packages. extend_skip appends to the defaults instead.
extend_skip = ["setup.py"]
