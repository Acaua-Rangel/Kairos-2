name: "Install environment and Hummingbot"
description: "Creates the Poetry .venv, installs all libraries and compiles Hummingbot"
inputs:
   program-cache-hit:
     required: true
     description: "Value of truth regarding the program cache being hit or not"
   dependencies-cache-hit:
     required: true
     description: "Value of truth regarding the program cache being hit or not"
runs:
  using: "composite"
  steps:
    # 3.12 is the floor the dependency set requires (pandas-ta needs >=3.12)
    - uses: actions/setup-python@v5
      if: ${{inputs.program-cache-hit}} != 'true' || ${{inputs.dependencies-cache-hit}} != 'true'
      with:
        python-version: "3.12"

    - name: Install Poetry
      if: ${{inputs.program-cache-hit}} != 'true' || ${{inputs.dependencies-cache-hit}} != 'true'
      shell: bash
      run: pipx install poetry==2.4.1

    # Install the locked dependency set (the .venv itself is cached by the caller)
    - name: Install dependencies
      if: ${{inputs.dependencies-cache-hit}} != 'true'
      shell: bash
      run: |
        poetry env use python3.12
        poetry install --no-root --with dev

    # Compile and run tests if code has changed
    - name: Compile Hummingbot
      shell: bash
      if: ${{inputs.program-cache-hit}} != 'true' || ${{inputs.dependencies-cache-hit}} != 'true'
      env:
        WITHOUT_CYTHON_OPTIMIZATIONS: 'true'
      run: |
        poetry env info
        poetry run pip install -e . --no-build-isolation --no-deps
